<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合月亭 - 有一份光，便发一份热</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-gold: #fbbf24;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            /* 保持原有的背景透明度不变 */
            background-image: linear-gradient(rgba(15, 23, 42, 0.6), rgba(15, 23, 42, 0.6)), url('assets/css/images/beijing.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* 白天模式：暗黑模式参数黑变白，背景图不变 */
        body.light-mode {
            background-image: linear-gradient(rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.6)), url('assets/css/images/beijing.jpg');
            color: #1e293b;
        }
        body.light-mode .hero h1 {
            background: linear-gradient(to right, #1e293b, #475569);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        body.light-mode nav { background: rgba(255,255,255,0.7); }
        body.light-mode .logo { color: #1e293b; }
        body.light-mode .section-title { color: #1e293b; }
        /* 白天模式下大框和卡片的适配 */
        body.light-mode .project-wrapper { background: rgba(255, 255, 255, 0.4); border-color: rgba(0,0,0,0.1); }
        body.light-mode .project-card { background: rgba(255,255,255,0.75); border-color: rgba(0,0,0,0.08); }

        body.dark-mode {
            background-image: none;
            background-color: var(--bg-dark);
        }

        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.1) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem 2rem;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--accent-gold);
        }

        .nav-right { display: flex; align-items: center; gap: 1.2rem; }
        .nav-link {
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
            white-space: nowrap;
        }
        .nav-link:hover { color: var(--accent-gold); }

        .nav-v-line {
            width: 1px;
            height: 18px;
            background: #ffffff;
            opacity: 0.3;
            flex-shrink: 0;
        }

        .icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            color: var(--text-main);
            transition: transform 0.3s ease, color 0.3s ease;
            cursor: pointer;
            background: none;
            border: none;
        }
        .icon-btn:hover { color: var(--accent-gold); transform: scale(1.1); }
        .icon-btn svg { width: 26px; height: 26px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }

        .hero {
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-top: 60px;
        }
        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-slogan {
            font-size: 1.5rem;
            color: var(--accent-gold);
            margin-bottom: 2rem;
            font-weight: 300;
            letter-spacing: 1px;
            position: relative;
            display: inline-block;
        }
        .hero-slogan::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 2px;
            background: var(--accent-gold);
            box-shadow: 0 0 10px var(--accent-gold);
        }
        .hero-actions {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .btn {
            padding: 0.8rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            font-size: 1rem;
            display: inline-block;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            background: rgba(251, 191, 36, 0.1);
        }
        .btn:hover {
            background: rgba(251, 191, 36, 0.2);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.4);
        }

        .projects-section { padding: 4rem 0 6rem; }
        .section-title { text-align: center; font-size: 2rem; margin-bottom: 3rem; }
        
        /* 新增：项目区大框样式，降低透明度 */
        .project-wrapper {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 3rem 2rem;
            backdrop-filter: blur(5px);
        }

        .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 2rem; }

        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 6rem;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }
        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border-color: rgba(251, 191, 36, 0.3);
        }

        .future-image { max-width: 100%; height: auto; border-radius: 8px; margin-bottom: 2rem; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .future-annotations { color: var(--text-sub); font-size: 1.1rem; line-height: 1.8; text-align: left; max-width: 700px; margin: 0 auto; }

        .text-links { margin-top: 3rem; text-align: center; font-size: 0.95rem; color: var(--text-sub); }
        .text-links a { color: var(--text-sub); text-decoration: none; transition: color 0.3s; margin: 0 0.5rem; }
        .text-links a:hover { color: var(--accent-gold); }
        .text-links span { color: var(--border-color); margin: 0 0.5rem; }

        footer { text-align: center; padding: 2rem; border-top: 1px solid var(--border-color); color: var(--text-sub); font-size: 0.85rem; }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .hero-slogan { font-size: 1.2rem; }
            .hero-actions { flex-direction: column; width: 100%; padding: 0 2rem; }
            .btn { width: 100%; text-align: center; }
            .logo { font-size: 1.3rem; }
            .logo img { width: 32px; height: 32px; }
            .project-card { padding: 3rem; }
            .project-wrapper { padding: 2rem 1rem; }
            .icon-btn { width: 32px; height: 32px; }
            .icon-btn svg { width: 22px; height: 22px; }
            .nav-link, .nav-v-line { display: none; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="https://avatars.githubusercontent.com/u/312074133?s=200&v=4" alt="合月亭 Logo">
                合月亭
            </a>
            <div class="nav-right">
                <a href="#" class="nav-link">公告</a>
                <div class="nav-v-line"></div>
                <a href="qq.html" class="nav-link">交流群</a>
                <div class="nav-v-line"></div>
                <button class="icon-btn" id="theme-toggle" title="切换背景模式" aria-label="切换背景模式">
                    <svg id="icon-img" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    <svg id="icon-moon" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    <svg id="icon-sun" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <header class="hero">
        <div class="container">
            <h1>合月亭</h1>
            <div class="hero-slogan">有一份光，便发一份热</div>
            <div class="hero-actions">
                <a href="wiki.html" class="btn">资源与文档</a>
                <a href="https://github.com/Heyue-org" class="btn" target="_blank" rel="noopener noreferrer">GitHub 仓库</a>
            </div>
        </div>
    </header>

    <section class="projects-section">
        <div class="container">
            <!-- 新增：项目区大框 -->
            <div class="project-wrapper">
                <h2 class="section-title">我们的项目</h2>
                <div class="projects-grid">
                    <div class="project-card">
                        <img src="https://via.placeholder.com/800x400/1e293b/fbbf24?text=Future+Image" alt="未来会有一张图" class="future-image">
                        <div class="future-annotations">
                            <p>没想好喵</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-links">
                <a href="Friend_Links.html">友情链接</a>
                <span>|</span>
                <a href="ContactDMCA.html">联系我们</a>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2024-2026 合月亭 (Heyue Pavilion). 本站内容采用 <a href="https://creativecommons.org/licenses/by-nc/4.0/deed.zh" target="_blank" rel="noopener noreferrer" style="color: var(--accent-gold); text-decoration: none; border-bottom: 1px dashed var(--accent-gold);">CC BY-NC 4.0</a> 协议，禁止商业用途。</p>
        </div>
    </footer>

    <script>
        const toggleBtn = document.getElementById('theme-toggle');
        const body = document.body;
        const icons = {
            img: document.getElementById('icon-img'),
            moon: document.getElementById('icon-moon'),
            sun: document.getElementById('icon-sun')
        };
        let mode = 0;

        function showIcon(name) {
            Object.values(icons).forEach(i => i.style.display = 'none');
            icons[name].style.display = 'block';
        }

        function applyMode() {
            body.classList.remove('light-mode', 'dark-mode');
            if (mode === 1) body.classList.add('dark-mode');
            if (mode === 2) body.classList.add('light-mode');
            showIcon(mode === 0 ? 'img' : mode === 1 ? 'moon' : 'sun');
        }

        toggleBtn.addEventListener('click', () => {
            mode = (mode + 1) % 3;
            applyMode();
        });

        applyMode();
    </script>
</body>
</html>
