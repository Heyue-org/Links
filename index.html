<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合月亭 - 有一份光，便发一份热</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-gold: #fbbf24;
            --accent-green: #10b981;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 背景光晕效果 */
        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.15) 0%, rgba(15, 23, 42, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* 导航栏 */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem 2rem;
            z-index: 100;
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--accent-gold);
        }

        /* 新增：GitHub 图标样式 */
        .github-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            color: var(--text-main);
            transition: transform 0.3s ease, color 0.3s ease;
        }
        .github-link:hover {
            color: var(--accent-gold);
            transform: scale(1.1);
        }
        .github-link svg {
            width: 28px;
            height: 28px;
        }

        /* 通用容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* 首屏 Hero */
        .hero {
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-top: 60px;
        }
        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-slogan {
            font-size: 1.5rem;
            color: var(--accent-gold);
            margin-bottom: 2rem;
            font-weight: 300;
            letter-spacing: 1px;
            position: relative;
            display: inline-block;
        }
        .hero-slogan::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 2px;
            background: var(--accent-gold);
            box-shadow: 0 0 10px var(--accent-gold);
        }
        .hero-actions {
            display: flex;
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .btn {
            padding: 0.8rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            font-size: 1rem;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            background: rgba(251, 191, 36, 0.1);
        }
        .btn:hover {
            background: rgba(251, 191, 36, 0.2);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.4);
        }

        /* 项目展示区 */
        .projects-section {
            padding: 4rem 0 6rem;
        }
        .section-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 3rem;
            color: var(--text-main);
        }
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
        }
        
        /* 项目卡片 */
        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 6rem;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }
        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border-color: rgba(251, 191, 36, 0.3);
        }
        
        /* 未来：图片与注释的样式 */
        .future-image {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .future-annotations {
            color: var(--text-sub);
            font-size: 1.1rem;
            line-height: 1.8;
            text-align: left;
            max-width: 700px;
            margin: 0 auto;
        }

        /* 友情链接 */
        .text-links {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.95rem;
            color: var(--text-sub);
        }
        .text-links a {
            color: var(--text-sub);
            text-decoration: none;
            transition: color 0.3s;
            margin: 0 0.5rem;
        }
        .text-links a:hover {
            color: var(--accent-gold);
        }
        .text-links span {
            color: var(--border-color);
            margin: 0 0.5rem;
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-sub);
            font-size: 0.85rem;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .hero-slogan { font-size: 1.2rem; }
            .hero-actions { flex-direction: column; width: 100%; padding: 0 2rem; }
            .btn { width: 100%; text-align: center; }
            .logo { font-size: 1.3rem; }
            .logo img { width: 32px; height: 32px; }
            .project-card { padding: 3rem; }
            .nav-container { justify-content: space-between; }
            .github-link { width: 32px; height: 32px; }
            .github-link svg { width: 24px; height: 24px; }
        }
    </style>
</head>
